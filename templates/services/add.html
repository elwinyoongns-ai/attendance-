{% extends "base.html" %}
{% block title %}New Service{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="d-flex align-items-center mb-4">
      <a href="{{ url_for('services_list') }}" class="btn btn-sm btn-outline-secondary me-3"><i class="bi bi-arrow-left"></i></a>
      <h2 class="fw-bold mb-0"><i class="bi bi-calendar-plus me-2 text-primary"></i>New Service</h2>
    </div>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="post">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold">Service Name <span class="text-danger">*</span></label>
              <input type="text" name="name" class="form-control" required autofocus
                     placeholder="e.g. Sunday Morning Service">
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Type <span class="text-danger">*</span></label>
              <select name="service_type" class="form-select" required>
                {% for t in service_types %}
                <option value="{{ t }}">{{ t }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
              <input type="date" name="date" class="form-control" value="{{ today }}" required>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Notes</label>
              <textarea name="notes" class="form-control" rows="3" placeholder="Optional notes…"></textarea>
            </div>
            <div class="col-12 pt-2">
              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-check-lg me-1"></i>Create &amp; Take Attendance
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
